name: Update Anywhere Shadowrocket routing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "source/**"
      - "sources.json"
      - "build_rules.py"
      - "build_anywhere_refilter.py"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: anywhere-routing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check conversion semantics
        run: python -m unittest discover -s tests -v

      - name: Download sources and build sets
        run: python build_rules.py

      - name: Validate published output
        run: python build_rules.py --check

      - name: Commit changed output
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/
          if git diff --cached --quiet; then
            echo "Rules and source fingerprints unchanged"
            exit 0
          fi
          git commit -m "chore: update Anywhere routing sets"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
